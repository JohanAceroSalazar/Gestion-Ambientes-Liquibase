databaseChangeLog:
  - changeSet:
      id: 01_tables
      author: johanacero2509@gmail.com
      context: billing
      labels: HU_02
      comment: person creation

      changes:
        - tagDatabase:
          tag: v1.0.1
        - sqlFile:
            path: 01_tables/01-create-person.sql
            endDelimiter: \nGO
            stripComments: false
      rollback:
        - sqlFile:
            path: 11_rollbacks/01_tables/01-create-person-rollback.sql

  - changeSet:
      id: 02_insert_person
      author: johanacero2509@gmail.com
      comment: insert person data

      changes:
      - sqlFile:
          path: 09_inserts/01-insert-person.sql
          stripComments: false
      rollback:
      - sqlFile:
          path: 11_rollbacks/09_inserts/01-insert-person-rollback.sql